<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>iZeni</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Mulish',sans-serif;
background:linear-gradient(180deg,#ff8a1d 0%,#ff6a00 45%,#eb5200 100%);
color:white;
min-height:100vh;
overflow-x:hidden;
}

/* HERO */

.hero{
padding:40px 20px 10px;
text-align:center;
}

.hero h1{
font-size:82px;
font-weight:900;
margin:0;
letter-spacing:-4px;
}

.hero p{
font-size:22px;
margin-top:15px;
opacity:0.95;
}

/* ROBOT */

.robot{
width:220px;
margin-top:20px;
filter:drop-shadow(0 0 40px rgba(255,255,255,0.35));
}

/* CARDS */

.starter-grid{

max-width:1100px;

margin:20px auto 40px;

padding:0 20px;

display:grid;

grid-template-columns:1fr 1fr;

gap:18px;

}

.starter-card{

padding:24px;

border-radius:26px;

font-size:18px;

font-weight:700;

line-height:1.5;

background:rgba(255,255,255,0.15);

border:1px solid rgba(255,255,255,0.15);

backdrop-filter:blur(18px);

transition:0.3s ease;

cursor:pointer;

}

.starter-card:hover{

transform:translateY(-5px);

background:rgba(255,255,255,0.24);

}

/* WEBCHAT */

.chat-shell{

max-width:1100px;

margin:0 auto 50px;

padding:0 20px;

}

#bp-embedded-webchat{

height:78vh;

border-radius:30px;

overflow:hidden;

box-shadow:
0 20px 60px rgba(0,0,0,0.18);

}

/* MOBILE */

@media(max-width:768px){

.hero h1{
font-size:58px;
}

.hero p{
font-size:18px;
}

.robot{
width:180px;
}

.starter-grid{
grid-template-columns:1fr;
}

#bp-embedded-webchat{
height:75vh;
}

}

</style>

</head>

<body>

<!-- HERO -->

<div class="hero">

<h1>iZeni</h1>

<p>
Your personalised AI banking companion
</p>

<img src="robot.png" class="robot">

</div>

<!-- CARDS -->

<div class="starter-grid">

<div class="starter-card">
🏦 Let iZeni craft an ideal banking setup
</div>

<div class="starter-card">
📈 Discover better ways to build wealth
</div>

<div class="starter-card">
💳 Find your perfect premium card match
</div>

<div class="starter-card">
✈️ Make international travel more effortless
</div>

<div class="starter-card">
🎮 Put your fraud awareness to the test
</div>

<div class="starter-card">
📱 Unlock hidden iMobile capabilities
</div>

</div>

<!-- EMBEDDED CHAT -->

<div class="chat-shell">

<div id="bp-embedded-webchat"></div>

</div>

<!-- BOTPRESS -->

<script src="https://cdn.botpress.cloud/webchat/v3.6/inject.js"></script>

<script src="https://files.bpcontent.cloud/2026/05/09/14/20260509140531-GOAB7DHN.js"></script>

</body>

</html>
