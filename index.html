<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>iZeni - AI Banking Experience</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Mulish',sans-serif;
background:linear-gradient(180deg,#ff8a1d 0%,#ff6a00 45%,#eb5200 100%);
color:white;
overflow-x:hidden;
min-height:100vh;
}

/* HERO */

.hero{
padding:40px 20px 10px;
text-align:center;
position:relative;
}

.hero h1{
font-size:82px;
font-weight:900;
line-height:0.95;
margin:0;
letter-spacing:-4px;
}

.hero p{
margin-top:18px;
font-size:22px;
font-weight:500;
opacity:0.95;
line-height:1.5;
}

/* ROBOT */

.robot-wrap{
position:relative;
margin-top:10px;
}

.robot-glow{
position:absolute;
width:340px;
height:340px;
background:rgba(255,255,255,0.18);
border-radius:50%;
filter:blur(70px);
left:50%;
transform:translateX(-50%);
top:20px;
z-index:0;
}

.robot{
width:240px;
position:relative;
z-index:2;
animation:float 5s ease-in-out infinite;
filter:drop-shadow(0 0 45px rgba(255,255,255,0.35));
}

@keyframes float{

0%{
transform:translateY(0px);
}

50%{
transform:translateY(-14px);
}

100%{
transform:translateY(0px);
}

}

/* STARTER GRID */

.starter-grid{

max-width:1100px;
margin:20px auto 40px;

padding:0 20px;

display:grid;
grid-template-columns:1fr 1fr;
gap:18px;

}

.starter-card{

padding:24px;

border-radius:26px;

font-size:18px;
font-weight:700;
line-height:1.5;

background:rgba(255,255,255,0.15);

border:1px solid rgba(255,255,255,0.15);

backdrop-filter:blur(18px);

transition:0.3s ease;

cursor:pointer;

}

.starter-card:hover{

transform:translateY(-5px);

background:rgba(255,255,255,0.24);

}

/* CHAT */

.chat-container{

max-width:1100px;
margin:0 auto 50px;
padding:0 20px;

}

.chat-frame{

width:100%;
height:78vh;

border:none;

border-radius:30px;

overflow:hidden;

background:white;

box-shadow:
0 20px 60px rgba(0,0,0,0.18);

}

/* MOBILE */

@media(max-width:768px){

.hero h1{
font-size:58px;
}

.hero p{
font-size:18px;
}

.robot{
width:190px;
}

.starter-grid{
grid-template-columns:1fr;
}

.chat-frame{
height:75vh;
}

}

</style>

</head>

<body>

<!-- HERO -->

<div class="hero">

<h1>iZeni</h1>

<p>
Your personalised AI banking companion
</p>

<div class="robot-wrap">

<div class="robot-glow"></div>

<img src="robot.png" class="robot">

</div>

</div>

<!-- STARTER CARDS -->

<div class="starter-grid">

<div class="starter-card">
🏦 Let iZeni craft an ideal banking setup
</div>

<div class="starter-card">
📈 Discover better ways to build wealth
</div>

<div class="starter-card">
💳 Find your perfect premium card match
</div>

<div class="starter-card">
✈️ Make international travel more effortless
</div>

<div class="starter-card">
🎮 Put your fraud awareness to the test
</div>

<div class="starter-card">
📱 Unlock hidden iMobile capabilities
</div>

</div>

<!-- EMBEDDED CHAT -->

<div class="chat-container">

<iframe
src="https://cdn.botpress.cloud/webchat/v2/shareable.html?botId=fe3a4263-6168-4dc5-b7f1-1f30529baa12&clientId=c2639e0b-48ce-4798-b906-70da72ce2ec8"
class="chat-frame">
</iframe>

</div>

</body>

</html>
