<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>iZeni</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:'Mulish',sans-serif;
background:linear-gradient(180deg,#ff8a1d 0%,#ff6a00 45%,#eb5200 100%);
color:white;
min-height:100vh;
overflow-x:hidden;
}

/* HERO */

.hero{
padding:30px 20px 10px;
text-align:center;
position:relative;
}

.robot-wrap{
position:relative;
display:inline-block;
}

.robot-glow{
position:absolute;
width:320px;
height:320px;
background:rgba(255,255,255,0.22);
border-radius:50%;
filter:blur(70px);
left:50%;
transform:translateX(-50%);
top:20px;
z-index:0;
}

.robot{
width:180px;
position:relative;
z-index:2;
animation:float 5s ease-in-out infinite;
filter:drop-shadow(0 0 40px rgba(255,255,255,0.45));
}

@keyframes float{

0%{
transform:translateY(0px);
}

50%{
transform:translateY(-12px);
}

100%{
transform:translateY(0px);
}

}

.hero-title{
font-size:64px;
font-weight:900;
margin-top:10px;
letter-spacing:-2px;
}

.hero-subtitle{
font-size:22px;
margin-top:8px;
opacity:0.95;
}

/* CHAT */

.chat-shell{
max-width:1100px;
margin:10px auto 40px;
padding:0 20px;
}

.chat-window{
display:flex;
flex-direction:column;
gap:18px;
margin-bottom:25px;
}

/* MESSAGE */

.bot-message,
.user-message{
display:flex;
width:100%;
}

.bot-message{
justify-content:flex-start;
}

.user-message{
justify-content:flex-end;
}

.message-bubble{
max-width:78%;
padding:22px 24px;
border-radius:28px;
font-size:18px;
line-height:1.8;
backdrop-filter:blur(18px);
background:rgba(255,255,255,0.15);
border:1px solid rgba(255,255,255,0.15);
box-shadow:0 12px 30px rgba(0,0,0,0.12);
white-space:pre-wrap;
}

.user-message .message-bubble{
background:white;
color:#ff6a00;
font-weight:700;
}

/* THINKING */

.typing{
display:flex;
align-items:center;
gap:4px;
}

.typing span{
width:7px;
height:7px;
background:white;
border-radius:50%;
animation:blink 1.4s infinite;
}

.typing span:nth-child(2){
animation-delay:0.2s;
}

.typing span:nth-child(3){
animation-delay:0.4s;
}

@keyframes blink{

0%{
opacity:0.2;
transform:translateY(0);
}

20%{
opacity:1;
transform:translateY(-2px);
}

100%{
opacity:0.2;
transform:translateY(0);
}

}

/* STARTER CARDS */

.starter-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
margin-bottom:28px;
transition:0.4s ease;
}

.starter-card{
padding:24px;
border-radius:22px;
cursor:pointer;
font-weight:700;
font-size:18px;
line-height:1.5;
backdrop-filter:blur(18px);
background:rgba(255,255,255,0.14);
border:1px solid rgba(255,255,255,0.15);
transition:0.3s ease;
}

.starter-card:hover{
transform:translateY(-4px);
background:rgba(255,255,255,0.22);
}

/* INPUT */

.input-bar{
display:flex;
gap:14px;
margin-bottom:40px;
position:sticky;
bottom:0;
padding-top:10px;
}

.input-bar input{
flex:1;
border:none;
outline:none;
padding:22px;
border-radius:20px;
font-size:17px;
font-family:'Mulish',sans-serif;
}

.input-bar button{
border:none;
padding:0 30px;
border-radius:20px;
background:white;
color:#ff6a00;
font-weight:800;
font-size:16px;
cursor:pointer;
}

/* MOBILE */

@media(max-width:768px){

.hero-title{
font-size:48px;
}

.hero-subtitle{
font-size:18px;
}

.robot{
width:140px;
}

.starter-grid{
grid-template-columns:1fr;
}

.message-bubble{
max-width:92%;
font-size:16px;
}

.input-bar{
flex-direction:column;
}

.input-bar button{
height:58px;
}

}

</style>

</head>

<body>

<!-- HERO -->

<div class="hero">

<div class="robot-wrap">

<div class="robot-glow"></div>

<img src="robot.png" class="robot">

</div>

<div class="hero-title">
iZeni
</div>

<div class="hero-subtitle">
Your personalised AI banking companion
</div>

</div>

<!-- CHAT -->

<div class="chat-shell">

<div class="chat-window" id="chatWindow"></div>

<!-- STARTER CARDS -->

<div class="starter-grid" id="starterGrid">

<div class="starter-card" onclick="selectStarter('Help me choose the right banking setup')">
🏦 Let iZeni craft an ideal banking setup
</div>

<div class="starter-card" onclick="selectStarter('Suggest smart wealth creation ideas')">
📈 Discover better ways to build wealth
</div>

<div class="starter-card" onclick="selectStarter('Suggest the best premium credit card for me')">
💳 Find your perfect premium card match
</div>

<div class="starter-card" onclick="selectStarter('Help me with travel and forex benefits')">
✈️ Make international travel more effortless
</div>

<div class="starter-card" onclick="selectStarter('Teach me about fraud awareness')">
🎮 Put your fraud awareness to the test
</div>

<div class="starter-card" onclick="selectStarter('Show useful iMobile features')">
📱 Unlock hidden iMobile capabilities
</div>

</div>

<!-- INPUT -->

<div class="input-bar">

<input
id="userInput"
type="text"
placeholder="Ask iZeni anything..."
onkeypress="handleKey(event)"
>

<button onclick="submitInput()">
Send
</button>

</div>

</div>

<script>

const API_URL = 'https://izeni-ai.vercel.app/api/chat'

/* CONVERSATION STATE */

let onboardingState = {
started:false,
nameCollected:false,
fullName:'',
personaCollected:false,
persona:''
}

/* MEMORY */

let conversationHistory = []

/* SCROLL */

function scrollBottom(){

window.scrollTo({
top:document.body.scrollHeight,
behavior:'smooth'
})

}

/* NAME VALIDATION */

function validateFullName(name){

const trimmed = name.trim()

const parts = trimmed.split(/\s+/)

if(parts.length < 2){
return false
}

for(let part of parts){

if(part.length < 2){
return false
}

if(!/^[a-zA-Z]+$/.test(part)){
return false
}

}

return true

}

/* HIDE STARTER CARDS */

function hideStarterCards(){

const grid=document.getElementById('starterGrid')

if(!grid){
return
}

grid.style.opacity='0'
grid.style.transform='translateY(10px)'

setTimeout(()=>{
grid.style.display='none'
},300)

}

/* STARTER CARD */

function selectStarter(text){

hideStarterCards()

onboardingState.started = true

addUserMessage(text)

setTimeout(()=>{

addBotMessage(
`Great choice ✨

Before we personalise your ideal banking setup, what should I call you?

(Please enter your full name.)`
)

},500)

}

/* USER MESSAGE */

function addUserMessage(text){

const chat=document.getElementById("chatWindow")

chat.innerHTML += `
<div class="user-message">
<div class="message-bubble">
${text}
</div>
</div>
`

scrollBottom()

}

/* BOT MESSAGE */

function addBotMessage(text){

const chat=document.getElementById("chatWindow")

chat.innerHTML += `
<div class="bot-message">
<div class="message-bubble">
${text}
</div>
</div>
`

scrollBottom()

}

/* THINKING */

function addTyping(){

const chat=document.getElementById("chatWindow")

chat.innerHTML += `
<div class="bot-message" id="typingBubble">
<div class="message-bubble">

<div class="typing">

<div>
✨ iZeni is thinking
</div>

<span></span>
<span></span>
<span></span>

</div>

</div>
</div>
`

scrollBottom()

}

/* REMOVE THINKING */

function removeTyping(){

const typing=document.getElementById("typingBubble")

if(typing){
typing.remove()
}

}

/* SEND TO AI */

async function sendMessage(text){

addTyping()

conversationHistory.push({
role:'user',
content:text
})

try{

const timeoutPromise = new Promise((_, reject) =>
setTimeout(() => reject(new Error('Timeout')), 45000)
)

const response = await Promise.race([

fetch(
API_URL,
{
method:'POST',

headers:{
'Content-Type':'application/json'
},

body:JSON.stringify({

messages:conversationHistory

})

}
),

timeoutPromise

])

const data = await response.json()

console.log(data)

removeTyping()

let reply = "iZeni could not generate a response."

if(data.success === true){

reply =
data.result?.response ||
data.result?.text ||
data.response ||
"iZeni is still thinking. Please try again."

}

if(data.errors && data.errors.length > 0){

reply =
data.errors[0].message ||
JSON.stringify(data.errors)

}

conversationHistory.push({
role:'assistant',
content:reply
})

/* LIMIT MEMORY */

if(conversationHistory.length > 12){

conversationHistory =
conversationHistory.slice(-12)

}

addBotMessage(reply)

}catch(error){

removeTyping()

console.log(error)

addBotMessage("Unable to reach iZeni right now.")

}

}

/* MAIN INPUT FLOW */

function submitInput(){

hideStarterCards()

const input =
document.getElementById('userInput')

const text = input.value.trim()

if(text === ''){
return
}

addUserMessage(text)

input.value=''

/* STEP 1 — NAME COLLECTION */

if(
onboardingState.started &&
!onboardingState.nameCollected
){

const validName =
validateFullName(text)

if(!validName){

setTimeout(()=>{

addBotMessage(
`Could you please enter your full name?

Both first and last name should be more meaningful 🙂`
)

},500)

return

}

onboardingState.nameCollected = true
onboardingState.fullName = text

const firstName =
text.split(' ')[0]

setTimeout(()=>{

addBotMessage(
`Lovely to meet you, ${firstName} ✨

To help me personalise your experience, which best describes you today?

• Salaried professional
• Frequent traveller
• Wealth builder / investor
• Premium lifestyle focused
• Just starting financial planning`
)

},600)

return

}

/* STEP 2 — PERSONA COLLECTION */

if(
onboardingState.nameCollected &&
!onboardingState.personaCollected
){

onboardingState.personaCollected = true
onboardingState.persona = text

const firstName =
onboardingState.fullName.split(' ')[0]

const enhancedPrompt = `
User Name: ${onboardingState.fullName}

User Persona:
${text}

User Query:
Help me choose the right banking setup.

Please respond:
- conversationally
- briefly
- intelligently
- in premium advisory tone
- ask only ONE meaningful next question
- avoid long paragraphs
- avoid generic explanations
`

sendMessage(enhancedPrompt)

return

}

/* NORMAL FLOW */

sendMessage(text)

}

/* ENTER KEY */

function handleKey(e){

if(e.key === 'Enter'){
submitInput()
}

}

</script>

</body>

</html>
