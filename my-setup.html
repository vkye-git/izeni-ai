<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Discover My Setup</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Mulish',sans-serif;

background:
linear-gradient(
180deg,
#ff8a1d 0%,
#ff6a00 50%,
#eb5200 100%
);

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

padding:20px;

color:white;
}

.container{
width:100%;
max-width:430px;
}

/* AI HEADER */

.ai-wrap{

display:flex;
align-items:center;
justify-content:center;
gap:10px;

margin-bottom:18px;

position:relative;
}

.ai-glow{

position:absolute;

width:120px;
height:120px;

background:rgba(255,255,255,0.16);

border-radius:50%;

filter:blur(40px);

top:-10px;
}

.ai-bot{

width:55px;

position:relative;

z-index:2;

animation:floatBot 5s ease-in-out infinite;

filter:
drop-shadow(0 0 22px rgba(255,255,255,0.28));
}

.ai-name{

font-size:28px;

font-weight:800;

letter-spacing:-1px;

position:relative;

z-index:2;

line-height:1;
}

@keyframes floatBot{

0%{
transform:translateY(0px);
}

50%{
transform:translateY(-8px);
}

100%{
transform:translateY(0px);
}

}

.card{

backdrop-filter:blur(18px);

background:
linear-gradient(
135deg,
rgba(255,255,255,0.18),
rgba(255,255,255,0.08)
);

border:1px solid rgba(255,255,255,0.18);

border-radius:28px;

padding:30px 24px;

box-shadow:
0 10px 30px rgba(0,0,0,0.12);

animation:fadeUp 0.35s ease;
}

@keyframes fadeUp{

from{
opacity:0;
transform:translateY(14px);
}

to{
opacity:1;
transform:translateY(0px);
}

}

h1{
font-size:32px;
line-height:1.18;
margin:0 0 12px;
font-weight:800;
letter-spacing:-1px;
}

p{
font-size:15px;
opacity:0.92;
line-height:1.6;
margin-bottom:22px;
}

input{

width:100%;

padding:16px;

border:none;

border-radius:16px;

font-size:16px;

font-family:'Mulish',sans-serif;

margin-bottom:14px;

box-sizing:border-box;

outline:none;
}

.button{

width:100%;

padding:16px;

border:none;

border-radius:18px;

background:white;

color:#ff6a00;

font-size:16px;

font-weight:800;

cursor:pointer;

transition:0.3s;
}

.button:hover{
transform:translateY(-2px);
}

.options{
display:grid;
gap:12px;
}

.option{

padding:16px;

border-radius:18px;

background:rgba(255,255,255,0.12);

border:1px solid rgba(255,255,255,0.12);

cursor:pointer;

transition:0.3s;

font-weight:600;

line-height:1.5;
}

.option:hover{

background:rgba(255,255,255,0.2);

transform:translateY(-2px);
}

.hidden{
display:none;
}

.mobile-wrap{
display:flex;
align-items:center;
background:white;
border-radius:16px;
overflow:hidden;
margin-bottom:14px;
}

.prefix{
padding:16px 14px;
color:#666;
font-weight:700;
font-size:16px;
background:#f4f4f4;
}

.mobile-input{
border:none;
margin:0;
border-radius:0;
flex:1;
}

.recommend-box{

padding:18px;

border-radius:20px;

background:rgba(255,255,255,0.10);

margin-bottom:20px;

line-height:1.9;
}

.secure-note{
font-size:13px;
opacity:0.78;
margin-top:-2px;
margin-bottom:18px;
line-height:1.5;
}

.explore-title{
margin-top:24px;
margin-bottom:12px;
font-size:15px;
font-weight:700;
opacity:0.88;
}

.explore-grid{
display:grid;
gap:10px;
}

.explore-card{

padding:14px 16px;

border-radius:16px;

background:rgba(255,255,255,0.10);

border:1px solid rgba(255,255,255,0.10);

font-size:14px;

font-weight:600;

cursor:pointer;

transition:0.3s;
}

.explore-card:hover{
background:rgba(255,255,255,0.18);
transform:translateY(-2px);
}

.error{

font-size:14px;

margin-top:-4px;

margin-bottom:14px;

opacity:0.92;
}

</style>

</head>

<body>

<div class="container">

<!-- STEP 1 -->

<div class="card" id="step1">

<div class="ai-wrap">

<div class="ai-glow"></div>

<img src="robot.png" class="ai-bot">

<div class="ai-name">
iZeni
</div>

</div>

<h1>
Let’s personalise your experience ✨
</h1>

<p>
What’s your full name?
</p>

<input
type="text"
id="username"
placeholder="Enter your full name">

<div class="error" id="nameError"></div>

<button class="button" onclick="saveName()">
Continue
</button>

</div>

</div>

<script>

function saveName(){

const input =
document.getElementById("username").value.trim();

const words = input.split(" ");

if(
input.length < 5 ||
words.length < 2
){

document.getElementById("nameError")
.innerHTML =
"Help iZeni know you better 😊 Please enter your full name.";

return;
}

alert("Journey continues from here ✨");

}

</script>

</body>

</html>
